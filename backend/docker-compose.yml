services:
  postgres:
    image: postgres:17-alpine
    container_name: tesserak-postgres
    environment:
      POSTGRES_USER: tesserak
      POSTGRES_PASSWORD: tesserak
      POSTGRES_DB: tesserak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesserak -d tesserak"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
