services:
  postgres:
    image: postgres:17-alpine
    container_name: tesserak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesserak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesserak}
      POSTGRES_DB: ${POSTGRES_DB:-tesserak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tesserak} -d ${POSTGRES_DB:-tesserak}"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tesserak-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      DATABASE_URL: postgres://${POSTGRES_USER:-tesserak}:${POSTGRES_PASSWORD:-tesserak}@postgres:5432/${POSTGRES_DB:-tesserak}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-tesserak-dev-secret-cambiar-en-produccion}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tesserak-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  pgdata:
